name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 100% line coverage is easy to reach without asserting anything.
  # Mutation testing is what makes the number mean something: it changes
  # the code and expects a test to fail.
  # ---------------------------------------------------------------------
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Xdebug 3 reads this before xdebug.mode; setup-php does not set the ini.
    env:
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Infection drives PHPUnit through tests/.config/phpunit.xml.dist,
          # which asks for path coverage — that requires Xdebug, not pcov.
          # Version pinned for the reason given in ci.yml; bump both together.
          coverage: xdebug
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash, xdebug-3.5.3

      - uses: ramsey/composer-install@v4

      # **Infection is not allowed to measure the suite itself.** It decides
      # whether to run a mutant at all by the nominal time of the tests
      # covering its line, summed per test *class*, and left to itself it
      # takes those timings from a run with Xdebug coverage switched on —
      # where a test of a millisecond is measured at two hundred. The sum then
      # passes the timeout and the mutant is skipped **in silence**: measured
      # on 07.10.2026, 269 of 604 mutants, reported as an MSI over the 312
      # that ran.
      #
      # So `composer mutation` produces the two things apart: which tests
      # cover which line, from the sharded coverage run; and how long a test
      # takes, from a run with no coverage anywhere near it. See
      # bin/mutation-inputs.php for the whole of the reasoning.
      #
      # The retry for the collector's crashes went with that change — the only
      # step here that runs Xdebug is the sharded coverage run, and
      # bin/coverage-shard.php carries the retry itself.
      - name: Infection
        run: composer mutation

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infection-report
          path: build/test/log/infection.html
          retention-days: 14


name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # The project's own architecture gates. They run first and without
  # vendor/, because a bare checkout is all they need — and because a
  # dependency violation should be reported before anything is installed.
  #
  # `tools: composer` is required: `tools: none` skips Composer entirely,
  # and the last step below would then silently fall back to whatever
  # version the runner image happens to preinstall.
  # ---------------------------------------------------------------------
  gates:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: No runtime dependencies
        run: php bin/check-no-runtime-deps.php

      - name: Namespace consistency
        run: php bin/check-namespace.php

      - name: No application-layer terms
        run: php bin/check-forbidden-terms.php

      - name: Layer direction
        run: php bin/check-layers.php

      - name: DocBlocks on the public API
        run: php bin/check-docblocks.php

      - name: composer.json is valid
        run: composer validate --strict --no-check-lock

  # ---------------------------------------------------------------------
  # Static analysis and code style. One PHP version is enough here.
  # ---------------------------------------------------------------------
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # The base list mirrors "require" in composer.json. intl and pdo are
          # added on top: PHPStan can only type-check the optional
          # i;unicode-casemap code path, and the PDO lock backend, when the
          # extensions they call into are actually loaded.
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash, intl, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: PHPStan
        run: composer analyse -- --error-format=github

      - name: Coding standard
        run: composer style

  # ---------------------------------------------------------------------
  # Tests across every supported PHP version. Coverage is measured on the
  # lowest supported version so that version-specific branches cannot hide.
  # ---------------------------------------------------------------------
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.coverage && ' + coverage' || '' }}
    runs-on: ubuntu-latest
    needs: gates
    # Xdebug 3 reads this before xdebug.mode, and setup-php does not set the
    # ini itself. Ignored on the runs where no coverage driver is installed.
    env:
      XDEBUG_MODE: coverage
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        coverage: [false]
        include:
          - php: '8.2'
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Xdebug, not pcov: tests/.config/phpunit.xml.dist asks for path
          # coverage, and php-code-coverage only offers a path-capable driver
          # when Xdebug is present. With pcov it collects nothing at all and
          # never writes the Clover report.
          #
          # The version is pinned because the newest release, 3.6.0alpha1,
          # ships a rewritten coverage engine that php-code-coverage 11 has
          # not caught up with: it reported 20 of 52 branches for a class that
          # Xdebug 3.4 reports as fully covered and on which a mutation run
          # killed 44 of 44 mutants. A gate has to measure the code rather
          # than the measuring device. Bump this together with the copies in
          # nightly.yml and release.yml once 3.6 is stable.
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
          # pdo_sqlite is listed although it is only a `suggest`: the tests of
          # the PDO lock backend skip themselves without it, and skipped tests
          # would take that class out of the coverage report rather than fail
          # the run. A floor that a missing extension can lower is no floor.
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash, pdo_sqlite${{ matrix.coverage && ', xdebug-3.5.3' || '' }}

      - uses: ramsey/composer-install@v4

      - name: Unit tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit --configuration=tests/.config/phpunit.xml.dist --no-coverage

      # Xdebug's coverage collector segfaults on a suite this size. It took
      # this job down on 24.09.2026 at test 1934 of 1954, on a branch whose
      # only change was a workflow file, and the nightly the same morning for
      # the same reason. The run slows down steadily towards the end, which is
      # what accumulating per-test path data looks like from outside.
      #
      # So it is tried once more, and only for that signature: 139 is 128 + 11,
      # which is how a shell reports a child killed by SIGSEGV. A test that
      # fails, or a floor that is not met, exits 1 or 2 — it fails on the first
      # attempt and stays failed, because a real failure repeats.
      #
      # This is a plaster and is meant to be read as one. The collector is
      # fragile in proportion to the suite, and the suite is still growing.
      - name: Unit tests with coverage
        if: ${{ matrix.coverage }}
        run: |
          run() {
            vendor/bin/phpunit \
              --configuration=tests/.config/phpunit.xml.dist \
              --coverage-clover=build/logs/clover.xml
          }

          status=0
          run || status=$?

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$status" -ne 139 ]; then
            echo "::error::The test run failed on its own terms; not retrying."
            exit "$status"
          fi

          echo "::warning::Xdebug's coverage collector crashed (signal 11). Running once more."
          run

      - name: Enforce coverage floor
        if: ${{ matrix.coverage }}
        run: php bin/check-coverage.php build/logs/clover.xml 100

      # `always()`, because the one run whose report anybody wants to look at
      # is the one that fell below the floor. On 24.09.2026 this job went red
      # on `main` at 2613 of 2615 branches and the report was not kept, so
      # finding out which two took a seeded re-run by hand.
      - name: Upload coverage report
        if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: clover
          path: build/logs/clover.xml
          retention-days: 7

  # ---------------------------------------------------------------------
  # R-ENV-03: the library must work without intl. This job proves it rather
  # than trusting the fallback code paths.
  #
  # The `extensions:` input ADDS to whatever the runner image already has —
  # it does not describe a minimal set. The Ubuntu image ships intl, so
  # listing it nowhere is not enough; it has to be removed with the `:`
  # prefix. The first CI run caught exactly this: the job was called
  # "Without intl" and had been running with it all along.
  #
  # openssl is deliberately NOT removed. setup-php disables every extension
  # depending on it, which takes TLS away from the `composer install` below.
  # openssl is only ever needed for the bundled TLS transports, and those do
  # not exist yet — when they do, this needs a second setup-php step after
  # the install rather than a longer list here.
  # ---------------------------------------------------------------------
  minimal-extensions:
    name: Without intl
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash, :intl

      - uses: ramsey/composer-install@v4

      # The job name is a promise, so the absence is asserted rather than
      # assumed. A `run:` block scalar is used because a plain YAML scalar
      # may not contain ": ".
      - name: Confirm intl is absent
        run: |
          php -r 'if (extension_loaded("intl")) {
              echo "::error::intl is loaded, but this job must prove the library works without it\n";
              exit(1);
          }'

      - name: Unit tests
        run: vendor/bin/phpunit --configuration=tests/.config/phpunit.xml.dist --no-coverage

  # ---------------------------------------------------------------------
  # The library must be usable without Composer at all.
  # ---------------------------------------------------------------------
  composer-free:
    name: Composer-free autoloader
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash

      - name: Load every class through autoload.php only
        run: php tests/integration/standalone-autoloader.php

  # ---------------------------------------------------------------------
  # What another implementation's test suite makes of ours (R-QS-04).
  #
  # Litmus is the interoperability suite for WebDAV, written against the
  # RFC rather than against this library, which is the whole point: our own
  # tests can only find what we thought to ask about.
  #
  # It runs against examples/minimal-webdav, so the example is held to
  # working as well. The server is started and stopped inside one step
  # because a process backgrounded in another may not survive the step
  # boundary.
  # ---------------------------------------------------------------------
  litmus:
    name: Litmus
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash

      - name: Install litmus
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes litmus

      # The sets for the part of the protocol that is built. litmus stops
      # after the first set that fails, so a failure in `basic` means the
      # later ones did not run at all rather than that they passed.
      #
      # `locks` joined them with P3-04. It was measured before it was added:
      # against P3-03 it stood at 32 of 41, and every one of the nine failures
      # was lock enforcement — the piece that chunk deliberately left out.
      - name: Run litmus against the example
        env:
          TESTS: basic copymove props locks
        run: |
          php -S 127.0.0.1:8000 examples/minimal-webdav/public/index.php > server.log 2>&1 &
          server=$!

          for _ in $(seq 1 40); do
            curl --fail --silent --output /dev/null http://127.0.0.1:8000/ && break
            sleep 0.25
          done

          set +e
          litmus http://127.0.0.1:8000/
          result=$?
          set -e

          kill "$server" 2>/dev/null || true

          echo '--- what the server said ---'
          cat server.log

          exit $result

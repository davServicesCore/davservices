name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # The project's own architecture gates. They run first and without
  # vendor/, because a bare checkout is all they need — and because a
  # dependency violation should be reported before anything is installed.
  #
  # `tools: composer` is required: `tools: none` skips Composer entirely,
  # and the last step below would then silently fall back to whatever
  # version the runner image happens to preinstall.
  # ---------------------------------------------------------------------
  gates:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: No runtime dependencies
        run: php bin/check-no-runtime-deps.php

      - name: Namespace consistency
        run: php bin/check-namespace.php

      - name: No application-layer terms
        run: php bin/check-forbidden-terms.php

      - name: Layer direction
        run: php bin/check-layers.php

      - name: DocBlocks on the public API
        run: php bin/check-docblocks.php

      - name: composer.json is valid
        run: composer validate --strict --no-check-lock

  # ---------------------------------------------------------------------
  # Static analysis and code style. One PHP version is enough here.
  # ---------------------------------------------------------------------
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # The base list mirrors "require" in composer.json. intl is added on
          # top: PHPStan can only type-check the optional i;unicode-casemap
          # code path when the extension it calls into is actually loaded.
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash, intl
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: PHPStan
        run: composer analyse -- --error-format=github

      - name: Coding standard
        run: composer style

  # ---------------------------------------------------------------------
  # Tests across every supported PHP version. Coverage is measured on the
  # lowest supported version so that version-specific branches cannot hide.
  # ---------------------------------------------------------------------
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.coverage && ' + coverage' || '' }}
    runs-on: ubuntu-latest
    needs: gates
    # Xdebug 3 reads this before xdebug.mode, and setup-php does not set the
    # ini itself. Ignored on the runs where no coverage driver is installed.
    env:
      XDEBUG_MODE: coverage
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        coverage: [false]
        include:
          - php: '8.2'
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Xdebug, not pcov: tests/.config/phpunit.xml.dist asks for path
          # coverage, and php-code-coverage only offers a path-capable driver
          # when Xdebug is present. With pcov it collects nothing at all and
          # never writes the Clover report.
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash

      - uses: ramsey/composer-install@v4

      - name: Unit tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit --configuration=tests/.config/phpunit.xml.dist --no-coverage

      - name: Unit tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --configuration=tests/.config/phpunit.xml.dist --coverage-clover=build/logs/clover.xml

      - name: Enforce coverage floor
        if: ${{ matrix.coverage }}
        run: php bin/check-coverage.php build/logs/clover.xml 100

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: clover
          path: build/logs/clover.xml
          retention-days: 7

  # ---------------------------------------------------------------------
  # R-ENV-03: the library must work without intl. This job proves it rather
  # than trusting the fallback code paths.
  #
  # The `extensions:` input ADDS to whatever the runner image already has —
  # it does not describe a minimal set. The Ubuntu image ships intl, so
  # listing it nowhere is not enough; it has to be removed with the `:`
  # prefix. The first CI run caught exactly this: the job was called
  # "Without intl" and had been running with it all along.
  #
  # openssl is deliberately NOT removed. setup-php disables every extension
  # depending on it, which takes TLS away from the `composer install` below.
  # openssl is only ever needed for the bundled TLS transports, and those do
  # not exist yet — when they do, this needs a second setup-php step after
  # the install rather than a longer list here.
  # ---------------------------------------------------------------------
  minimal-extensions:
    name: Without intl
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash, :intl

      - uses: ramsey/composer-install@v4

      # The job name is a promise, so the absence is asserted rather than
      # assumed. A `run:` block scalar is used because a plain YAML scalar
      # may not contain ": ".
      - name: Confirm intl is absent
        run: |
          php -r 'if (extension_loaded("intl")) {
              echo "::error::intl is loaded, but this job must prove the library works without it\n";
              exit(1);
          }'

      - name: Unit tests
        run: vendor/bin/phpunit --configuration=tests/.config/phpunit.xml.dist --no-coverage

  # ---------------------------------------------------------------------
  # The library must be usable without Composer at all.
  # ---------------------------------------------------------------------
  composer-free:
    name: Composer-free autoloader
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, xml, xmlreader, xmlwriter, mbstring, json, filter, hash

      - name: Load every class through autoload.php only
        run: php tests/integration/standalone-autoloader.php
